<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03070e">
  <title>Gravity Well Clone</title>
  <script type="importmap"></script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #03070e; }
    canvas { display: block; width: 100%; height: 100%; }
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-content: center;
      gap: 0.75rem;
      color: #6abfff;
      background: #03070e;
      text-align: center;
      font-family: system-ui, sans-serif;
    }
    .loading-screen h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); letter-spacing: 0.08em; }
    .loading-screen p { margin: 0; color: #d3d3d3; font-size: clamp(1rem, 2.5vw, 1.35rem); }
    .loading-screen .status { margin-top: 1.25rem; color: #5cff78; }
  </style>
</head>
<body>
  <main id="loading" class="loading-screen" aria-live="polite" aria-label="Game loading">
    <h1>Gravity Well Clone</h1>
    <p>By Stephen Lin</p>
    <p class="status">Loading...</p>
  </main>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
